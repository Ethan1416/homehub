         on the light theme, making the clock/battery disappear. -->

  <body>
    <!-- Fixed black bar covers the iOS status bar (time/battery/signal) so white
         content never bleeds behind it when scrolling. Height = safe-area-inset-top. -->
    <div id="sb-cover" style="position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,54px);background:#0d0f1a;z-index:99999;pointer-events:none"></div>
